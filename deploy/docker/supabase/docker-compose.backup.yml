# Override opcional: respaldo automático de la base de datos.
# No viene con el stack oficial de Supabase (ellos dejan los backups como
# tarea manual del operador) — lo agregamos porque en Netmask todavía no
# hay alguien asignado a esa tarea.
#
# Activar (una sola vez):
#   sh run.sh config add backup
# Con eso queda en COMPOSE_FILE dentro de .env, y "sh run.sh start" ya lo
# incluye siempre. Los dumps quedan en ./backups (ya ignorado por .gitignore).

services:
  db-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: supabase-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Todos los días a las 3:00 a.m.
      SCHEDULE: "${BACKUP_SCHEDULE:-0 3 * * *}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
      BACKUP_KEEP_WEEKS: "${BACKUP_KEEP_WEEKS:-8}"
      BACKUP_KEEP_MONTHS: "${BACKUP_KEEP_MONTHS:-6}"
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups:/backups
