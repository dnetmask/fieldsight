# Gateway único (sin dominio): un solo nginx, un solo puerto público,
# enrutando por la ruta de la URL entre la app de FieldSight y la API de
# Supabase -- necesario porque solo hay un puerto nateado disponible
# hacia la VM. Mismo patrón de rutas que usa el propio nginx oficial de
# Supabase (/auth, /rest, /storage/v1/, etc.), solo que aquí también se
# agrega "/" para la app en vez de para Studio.
#
# Studio (el panel de administración de Supabase) NO se expone por aquí
# a propósito -- para usarlo, hacer un túnel SSH hacia la VM en vez de
# abrir otro puerto público:
#   ssh -L 8000:localhost:8000 usuario@IP-de-la-VM
# y abrir http://localhost:8000 en el navegador de tu PC.

upstream fieldsight_app { server fieldsight:8080; }
upstream supabase_api { server api-gw:8000; }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeceras grandes de autenticación de Supabase -- evita 502.
    large_client_header_buffers 4 16k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;

    location /auth {
        proxy_pass http://supabase_api;
    }
    location /rest {
        proxy_pass http://supabase_api;
    }
    location /graphql {
        proxy_pass http://supabase_api;
    }
    location /realtime/v1/ {
        proxy_pass http://supabase_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /storage/v1/ {
        proxy_pass http://supabase_api;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
        client_max_body_size 0;
    }
    location /functions {
        proxy_pass http://supabase_api;
    }
    location /mcp {
        proxy_pass http://supabase_api;
    }
    location /sso {
        proxy_pass http://supabase_api;
    }

    # Todo lo demás (la app) -- tiene que ir de última.
    location / {
        proxy_pass http://fieldsight_app;
    }
}
